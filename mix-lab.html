<main class="eq-app">
<section class="eq-hero"><div><span class="phase-badge">PHASE 1</span><h1>🎚 EQトレーニング</h1><p>内蔵音源を聴きながら3バンドEQを操作し、音の変化を波形とスペクトラムで確認できる基礎ラボ。</p></div><div class="hero-state" id="heroState">READY</div></section>
<section class="eq-card"><div class="section-heading"><div><span class="step">STEP 1</span><h2>内蔵音源を選ぶ</h2></div><span class="mini-note">押すと即再生</span></div><div class="source-grid"><button class="source-btn active" data-source="drums"><span>🥁</span>ドラム</button><button class="source-btn" data-source="bass"><span>🎸</span>ベース</button><button class="source-btn" data-source="keys"><span>🎹</span>キー</button><button class="source-btn" data-source="mix"><span>🎵</span>ミックス</button></div><p class="status" id="status" aria-live="polite">音源ボタンを押すと、その場で再生するよ。</p></section>
<section class="eq-card"><div class="section-heading"><div><span class="step">STEP 2</span><h2>再生操作</h2></div></div><div class="transport"><button id="playBtn" type="button">▶ 再生</button><button id="stopBtn" class="secondary" type="button">■ 停止</button><button id="resetBtn" class="secondary" type="button">↺ EQリセット</button></div></section>
<section class="eq-card"><div class="section-heading"><div><span class="step">STEP 3</span><h2>3バンドEQ</h2></div><span class="mini-note">-12〜+12 dB</span></div><div class="eq-controls"><label class="eq-control low"><header><span>LOW <small>160Hz</small></span><strong id="lowValue">0 dB</strong></header><input id="lowGain" type="range" min="-12" max="12" step="1" value="0" aria-label="低域ゲイン"></label><label class="eq-control mid"><header><span>MID <small>1kHz</small></span><strong id="midValue">0 dB</strong></header><input id="midGain" type="range" min="-12" max="12" step="1" value="0" aria-label="中域ゲイン"></label><label class="eq-control high"><header><span>HIGH <small>6kHz</small></span><strong id="highValue">0 dB</strong></header><input id="highGain" type="range" min="-12" max="12" step="1" value="0" aria-label="高域ゲイン"></label></div><button id="bypassBtn" class="bypass" type="button" aria-pressed="false">EQ ON（クリックで原音比較）</button></section>
<section class="eq-card analyzer-card"><div class="section-heading"><div><span class="step">STEP 4</span><h2>リアルタイム・アナライザー</h2></div><span class="live-dot"><i></i> LIVE</span></div><div class="analyzer-tabs" role="tablist"><button class="analyzer-tab active" data-view="spectrum" type="button">スペクトラム</button><button class="analyzer-tab" data-view="waveform" type="button">波形</button></div><div class="canvas-wrap"><canvas id="analyzerCanvas" width="900" height="300" aria-label="リアルタイム音声解析"></canvas><div class="frequency-labels" id="frequencyLabels"><span>60Hz</span><span>250Hz</span><span>1kHz</span><span>4kHz</span><span>16kHz</span></div></div><div class="meter-row"><span>OUTPUT</span><div class="meter-track"><div id="outputMeter" class="meter-fill"></div></div><strong id="outputValue">-∞ dB</strong></div><p class="analyzer-help" id="analyzerHelp">横軸が周波数、縦軸が音量。EQを動かすと音の山が変化するよ。</p></section>
</main>
