<main class="eq-app">
<section class="eq-hero"><h1>🎚 EQトレーニング</h1><p>古い実装をすべて外して、内蔵音源の即時再生と3バンドEQだけで作り直した新バージョン。</p></section>
<section class="eq-card"><h2>1. 内蔵音源を選ぶ</h2><div class="source-grid"><button class="source-btn active" data-source="drums">🥁 ドラム</button><button class="source-btn" data-source="bass">🎸 ベース</button><button class="source-btn" data-source="keys">🎹 キー</button><button class="source-btn" data-source="mix">🎵 ミックス</button></div><p class="status" id="status">音源ボタンを押すと、その場で再生するよ。</p></section>
<section class="eq-card"><h2>2. 再生操作</h2><div class="transport"><button id="playBtn" type="button">▶ 再生</button><button id="stopBtn" class="secondary" type="button">■ 停止</button><button id="resetBtn" class="secondary" type="button">EQリセット</button></div></section>
<section class="eq-card"><h2>3. EQを動かす</h2><div class="eq-controls"><label class="eq-control"><header><span>低域 160Hz</span><strong id="lowValue">0 dB</strong></header><input id="lowGain" type="range" min="-12" max="12" step="1" value="0"></label><label class="eq-control"><header><span>中域 1kHz</span><strong id="midValue">0 dB</strong></header><input id="midGain" type="range" min="-12" max="12" step="1" value="0"></label><label class="eq-control"><header><span>高域 6kHz</span><strong id="highValue">0 dB</strong></header><input id="highGain" type="range" min="-12" max="12" step="1" value="0"></label></div><button id="bypassBtn" class="bypass" type="button">EQを有効にする</button></section>
</main>
