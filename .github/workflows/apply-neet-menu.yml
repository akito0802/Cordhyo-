name: Apply NEET menu
on:
  push:
    paths:
      - 'neet-menu-ui.js'
      - '.github/workflows/apply-neet-menu.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject menu into all pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag='<script src="neet-menu-ui.js?v=20260805-1"></script>'
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if tag in s: continue
              if '</body>' not in s: continue
              p.write_text(s.replace('</body>',tag+'\n</body>',1),encoding='utf-8')
              changed.append(str(p))
          print('updated:', ', '.join(changed))
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "コード辞典全ページのメニューを完成版UIに統一"
          git push
