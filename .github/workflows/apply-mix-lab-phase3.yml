name: Apply Mix Lab Phase 3

on:
  push:
    paths:
      - '.github/workflows/apply-mix-lab-phase3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Phase 3 into Mix Lab
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mix-lab.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('PHASE 1 + 2','PHASE 1 + 2 + 3')
          s=s.replace('NEW EFFECTS','PRACTICE & AI')
          s=s.replace('EQで音を整え、コンプレッサー・空間系・ステレオ・サチュレーションまで実際に触って変化を学べるミックス練習ラボ。','EQ・エフェクト・AI診断・マルチトラック・リファレンス比較まで、実際に触って学べるミックス練習ラボ。')
          old='<script src="mix-lab-phase2.js?v=20260807-1"></script><script src="shared-menu.js?v=1"></script>'
          new='<script src="mix-lab-phase2.js?v=20260807-1"></script><script src="mix-lab-phase3.js?v=20260807-1"></script><script src="shared-menu.js?v=1"></script>'
          if 'mix-lab-phase3.js' not in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Phase 3 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix-lab.html
          git diff --cached --quiet || git commit -m "Integrate Mix Lab Phase 3"
          git push
