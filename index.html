<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Guitar Chord Book</title>
  <link rel="stylesheet" href="style.css?v=20260728-4" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">GUITAR CHORD BOOK</p>
      <h1>選んですぐ見られる<br>ギターコード表</h1>
      <p class="lead">ルート音とコードの種類を選ぶだけ。</p>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-label="コード選択">
      <div class="filters selection-filters">
        <label>
          ルート音
          <select id="rootSelect" aria-label="ルート音を選択">
            <option>C</option><option>C#</option><option>D</option><option>D#</option>
            <option>E</option><option>F</option><option>F#</option><option>G</option>
            <option>G#</option><option>A</option><option>A#</option><option>B</option>
          </select>
        </label>

        <label>
          コードの種類
          <select id="typeSelect" aria-label="コードの種類を選択">
            <option value="major">メジャー</option>
            <option value="minor">マイナー</option>
            <option value="7">7</option>
            <option value="maj7">maj7</option>
            <option value="m7">m7</option>
            <option value="sus2">sus2</option>
            <option value="sus4">sus4</option>
            <option value="add9">add9</option>
          </select>
        </label>
      </div>
    </section>

    <section id="selectedChord" class="selected-chord" aria-live="polite"></section>
  </main>

  <footer>Guitar Chord Book — Vanilla HTML / CSS / JavaScript</footer>
  <script src="script.js?v=20260728-4"></script>
</body>
</html>
