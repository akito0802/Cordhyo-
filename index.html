<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Guitar Chord Book</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">GUITAR CHORD BOOK</p>
      <h1>選んですぐ見られる<br>ギターコード表</h1>
      <p class="lead">種類とコード名を選択ボックスから選ぶだけ。</p>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-label="コード選択">
      <div class="filters selection-filters">
        <label>
          コードの種類
          <select id="typeFilter">
            <option value="all">すべて</option>
            <option value="major">メジャー</option>
            <option value="minor">マイナー</option>
            <option value="7th">7th</option>
            <option value="maj7">maj7</option>
            <option value="m7">m7</option>
            <option value="sus">sus</option>
            <option value="add">add</option>
          </select>
        </label>

        <label>
          コード名
          <select id="chordSelect" aria-label="表示するコードを選択"></select>
        </label>
      </div>
    </section>

    <section id="selectedChord" class="selected-chord" aria-live="polite"></section>
  </main>

  <footer>Guitar Chord Book — Vanilla HTML / CSS / JavaScript</footer>
  <script src="script.js"></script>
</body>
</html>
