<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Guitar Chord Book</title>
  <link rel="stylesheet" href="style.css?v=20260728-12" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">GUITAR CHORD BOOK</p>
      <h1>選んですぐ見られる<br>ギターコード表</h1>
      <p class="lead">ルート音・コードの種類・実用的なオンコードから選べるよ。</p>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-label="コード選択">
      <div class="filters selection-filters">
        <label>
          ルート音
          <select id="rootSelect" aria-label="ルート音を選択">
            <option>C</option><option>C#</option><option>D</option><option>D#</option>
            <option>E</option><option>F</option><option>F#</option><option>G</option>
            <option>G#</option><option>A</option><option>A#</option><option>B</option>
          </select>
        </label>

        <label>
          コードの種類
          <select id="typeSelect" aria-label="コードの種類を選択">
            <optgroup label="基本コード">
              <option value="major">メジャー</option>
              <option value="minor">マイナー</option>
              <option value="5">5（パワーコード）</option>
              <option value="6">6</option>
              <option value="m6">m6</option>
              <option value="7">7</option>
              <option value="maj7">maj7</option>
              <option value="m7">m7</option>
            </optgroup>
            <optgroup label="よく使う装飾コード">
              <option value="sus2">sus2</option>
              <option value="sus4">sus4</option>
              <option value="7sus4">7sus4</option>
              <option value="add9">add9</option>
              <option value="madd9">m(add9)</option>
            </optgroup>
            <optgroup label="少し発展">
              <option value="m7b5">m7♭5</option>
              <option value="dim">dim</option>
              <option value="dim7">dim7</option>
              <option value="aug">aug</option>
            </optgroup>
          </select>
        </label>

        <label>
          オンコード
          <select id="bassSelect" aria-label="オンコードを選択">
            <option value="none">なし</option>
          </select>
        </label>
      </div>
      <p class="control-note">選んだコードで実際によく使われるオンコードだけ候補に出るよ。</p>
    </section>

    <section id="selectedChord" class="selected-chord" aria-live="polite"></section>
  </main>

  <footer>Guitar Chord Book — Vanilla HTML / CSS / JavaScript</footer>
  <script src="script.js?v=20260728-12"></script>
</body>
</html>
