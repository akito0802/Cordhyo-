<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Guitar Chord Book</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">GUITAR CHORD BOOK</p>
      <h1>見やすくて、すぐ使える<br>ギターコード表</h1>
      <p class="lead">コード名・種類・難易度から探せる、スマホ向けコード辞典。</p>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-label="コード検索">
      <label class="search-box">
        <span>コードを検索</span>
        <input id="searchInput" type="search" placeholder="例：C、Am7、F#m" autocomplete="off" />
      </label>

      <div class="filters">
        <label>
          種類
          <select id="typeFilter">
            <option value="all">すべて</option>
            <option value="major">メジャー</option>
            <option value="minor">マイナー</option>
            <option value="7th">7th</option>
            <option value="maj7">maj7</option>
            <option value="m7">m7</option>
            <option value="sus">sus</option>
            <option value="add">add</option>
          </select>
        </label>

        <label>
          難易度
          <select id="difficultyFilter">
            <option value="all">すべて</option>
            <option value="1">★☆☆</option>
            <option value="2">★★☆</option>
            <option value="3">★★★</option>
          </select>
        </label>
      </div>
    </section>

    <section class="status-row">
      <p id="resultCount"></p>
      <button id="favoriteToggle" class="ghost-button" type="button">☆ お気に入りのみ</button>
    </section>

    <section id="chordGrid" class="chord-grid" aria-live="polite"></section>
  </main>

  <dialog id="chordDialog">
    <button id="closeDialog" class="close-button" aria-label="閉じる">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <footer>Guitar Chord Book — Vanilla HTML / CSS / JavaScript</footer>
  <script src="script.js"></script>
</body>
</html>
