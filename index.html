<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Guitar Chord Book</title>
  <link rel="stylesheet" href="style.css?v=20260728-17" />
  <link rel="stylesheet" href="search-style.css?v=20260728-1" />
  <link rel="stylesheet" href="usage-guide.css?v=20260729-1" />
</head>
<body>
  <header class="hero"><div><p class="eyebrow">GUITAR CHORD BOOK</p><h1>選んですぐ見られる<br>ギターコード表</h1><p class="lead">ルート音・コードの種類・実用的なオンコードから選べるよ。</p></div></header>
  <main class="container">
    <section class="controls" aria-label="コード選択">
      <label class="search-field">コード検索<input id="chordSearch" type="search" placeholder="例：maj9、♭9、sus" autocomplete="off"><small id="searchResult"></small></label>
      <div class="filters selection-filters">
        <label>ルート音<select id="rootSelect" aria-label="ルート音を選択"><option>C</option><option>C#</option><option>D</option><option>D#</option><option>E</option><option>F</option><option>F#</option><option>G</option><option>G#</option><option>A</option><option>A#</option><option>B</option></select></label>
        <label>コードの種類
          <select id="typeSelect" aria-label="コードの種類を選択">
            <optgroup label="基本・省略コード">
              <option value="major">メジャー</option><option value="minor">マイナー</option><option value="5">5</option><option value="5add9">5(add9)</option><option value="no3">no3</option><option value="no5">no5</option>
              <option value="6">6</option><option value="m6">m6</option><option value="7">7</option><option value="maj7">maj7</option><option value="m7">m7</option><option value="mMaj7">mMaj7</option>
            </optgroup>
            <optgroup label="装飾・サスコード">
              <option value="sus2">sus2</option><option value="sus4">sus4</option><option value="add2">add2</option><option value="add4">add4</option><option value="add9">add9</option><option value="madd9">m(add9)</option><option value="mAdd2">m(add2)</option><option value="mAdd4">m(add4)</option><option value="madd11">m(add11)</option><option value="madd13">m(add13)</option><option value="add11">add11</option>
              <option value="6sus2">6sus2</option><option value="6sus4">6sus4</option><option value="7sus2">7sus2</option><option value="7sus4">7sus4</option><option value="7sus4b9">7sus4♭9</option><option value="7sus2b9">7sus2♭9</option><option value="7sus2s9">7sus2♯9</option><option value="9sus2">9sus2</option><option value="9sus4">9sus4</option><option value="13sus2">13sus2</option><option value="13sus4">13sus4</option>
              <option value="sus2add9">sus2(add9)</option><option value="sus4add9">sus4(add9)</option>
            </optgroup>
            <optgroup label="メジャー・マイナー拡張">
              <option value="maj7b5">maj7♭5</option><option value="maj7s5">maj7♯5</option><option value="maj9b5">maj9♭5</option><option value="maj9s5">maj9♯5</option><option value="maj13b5">maj13♭5</option>
              <option value="m7s5">m7♯5</option><option value="m9s5">m9♯5</option><option value="m11s5">m11♯5</option><option value="mMaj7s11">mMaj7♯11</option><option value="mMaj9s11">mMaj9♯11</option>
            </optgroup>
            <optgroup label="9・11・13系">
              <option value="9">9</option><option value="m9">m9</option><option value="maj9">maj9</option><option value="mMaj9">mMaj9</option><option value="69">6/9</option><option value="m69">m6/9</option>
              <option value="11">11</option><option value="m11">m11</option><option value="maj11">maj11</option><option value="maj7s11">maj7♯11</option><option value="maj9s11">maj9♯11</option>
              <option value="13">13</option><option value="m13">m13</option><option value="maj13">maj13</option><option value="maj13s11">maj13♯11</option><option value="mMaj13">mMaj13</option><option value="13b5">13♭5</option><option value="13s5">13♯5</option><option value="13b9s11">13(♭9,♯11)</option><option value="13s9b13">13(♯9,♭13)</option>
            </optgroup>
            <optgroup label="オルタード">
              <option value="7b5">7♭5</option><option value="7s5">7♯5</option><option value="7b9">7♭9</option><option value="7s9">7♯9</option><option value="7b13">7♭13</option><option value="7s11">7♯11</option>
              <option value="7b9b13">7(♭9,♭13)</option><option value="7s9b13">7(♯9,♭13)</option><option value="7b9s11">7(♭9,♯11)</option><option value="7s9s11">7(♯9,♯11)</option>
              <option value="7b5b9">7(♭5,♭9)</option><option value="7b5s9">7(♭5,♯9)</option><option value="7s5b9">7(♯5,♭9)</option><option value="7s5s9">7(♯5,♯9)</option>
              <option value="9b5">9♭5</option><option value="9s5">9♯5</option><option value="13b9">13♭9</option><option value="13s9">13♯9</option>
            </optgroup>
            <optgroup label="ディミニッシュ・オーギュメント">
              <option value="m7b5">m7♭5</option><option value="m9b5">m9♭5</option><option value="m11b5">m11♭5</option>
              <option value="dim">dim</option><option value="dim7">dim7</option><option value="dimMaj7">dimMaj7</option><option value="dim9">dim9</option><option value="dimb9">dim♭9</option><option value="dims9">dim♯9</option><option value="dimadd9">dim(add9)</option><option value="dim7add11">dim7(add11)</option>
              <option value="aug">aug</option><option value="aug7">aug7</option><option value="augmaj7">augmaj7</option><option value="aug9">aug9</option><option value="augs11">aug♯11</option><option value="augMaj9">augMaj9</option><option value="aug13">aug13</option>
            </optgroup>
          </select>
        </label>
        <label class="slash-field">オンコード<select id="bassSelect" aria-label="オンコードを選択"><option value="none">なし</option></select></label>
      </div>
      <p class="control-note">テンションコードは、弾きやすさを優先して一部の音を省略した実用フォームも表示するよ。</p>
      <div class="popular-slash" aria-label="よく使うオンコード"><div class="popular-slash-heading"><p>よく使うオンコード</p><span>タップですぐ表示</span></div><div id="slashQuickList" class="slash-quick-list"></div></div>
    </section>

    <section id="usageGuide" class="usage-guide" aria-labelledby="usageTitle">
      <div class="usage-guide-heading"><div><h2 id="usageTitle">曲の最初</h2><p id="usageDescription"></p></div><span class="usage-guide-note">コードを押すとフォームを表示</span></div>
      <div id="usageTabs" class="usage-tabs" role="tablist" aria-label="コードの使い方を切り替え"></div>
      <div class="usage-table-wrap">
        <table class="usage-table"><thead><tr><th>使えるコード</th><th>役割・雰囲気</th><th>次につなぐ例</th></tr></thead><tbody id="usageTableBody"></tbody></table>
      </div>
    </section>

    <section id="selectedChord" class="selected-chord" aria-live="polite"></section>
  </main>
  <footer>Guitar Chord Book — Vanilla HTML / CSS / JavaScript</footer>
  <script src="script.js?v=20260728-17"></script>
  <script src="advanced-chords.js?v=20260728-1"></script>
  <script src="more-chords.js?v=20260728-1"></script>
  <script src="chord-search.js?v=20260728-1"></script>
  <script src="usage-guide.js?v=20260729-1"></script>
</body>
</html>
